name: Worker Session
run-name: Worker Session / ${{ inputs.mode }} / ${{ inputs.session_id || 'manual' }}

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Run a health check only or keep the Worker session running
        required: true
        default: smoke_test
        type: choice
        options:
          - smoke_test
          - session
      session_id:
        description: Session identifier issued by the Cloudflare API (required for session mode)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: worker-session
  cancel-in-progress: false

jobs:
  worker:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Validate session configuration
        if: inputs.mode == 'session'
        shell: bash
        env:
          WORKER_SESSION_ID: ${{ inputs.session_id }}
          WORKER_SESSION_PUBLIC_KEY: ${{ vars.WORKER_SESSION_PUBLIC_KEY }}
        run: |
          if [[ -z "$WORKER_SESSION_ID" || -z "$WORKER_SESSION_PUBLIC_KEY" ]]; then
            echo "session mode requires session_id and the WORKER_SESSION_PUBLIC_KEY repository variable."
            exit 1
          fi

      - name: Build Worker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: containers/worker/Dockerfile
          load: true
          tags: browser-worker:session
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start isolated browser network and egress proxy
        run: |
          docker network create --internal behavior-browser
          docker run --detach --name browser-egress --network bridge \
            --init --read-only --cap-drop ALL --security-opt no-new-privileges \
            --cpus 0.5 --memory 128m --pids-limit 64 \
            browser-worker:session node egress-proxy.ts
          docker network connect behavior-browser browser-egress
          for attempt in {1..30}; do
            if docker exec browser-egress node -e "fetch('http://127.0.0.1:3128/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"; then
              exit 0
            fi
            sleep 1
          done
          exit 1

      - name: Start Worker container
        env:
          WORKER_SESSION_ID: ${{ inputs.session_id }}
          WORKER_SESSION_PUBLIC_KEY: ${{ vars.WORKER_SESSION_PUBLIC_KEY }}
        run: >-
          docker run --detach
          --name browser-worker
          --network behavior-browser
          --init
          --read-only
          --cap-drop ALL
          --security-opt no-new-privileges
          --security-opt seccomp=containers/worker/seccomp_profile.json
          --tmpfs /tmp:rw,nosuid,nodev,size=512m
          --tmpfs /home/worker/.cache:rw,nosuid,nodev,uid=10001,gid=10001,mode=0700,size=256m
          --tmpfs /home/worker/.config:rw,nosuid,nodev,uid=10001,gid=10001,mode=0700,size=32m
          --shm-size 512m
          --cpus 4 --memory 2g --pids-limit 512
          --env WORKER_PROXY_URL=http://browser-egress:3128
          --env WORKER_SESSION_ID
          --env WORKER_SESSION_PUBLIC_KEY
          --mount type=bind,source=${{ github.workspace }}/worker/test,target=/app/worker/test,readonly
          browser-worker:session

      - name: Check Worker health
        shell: bash
        run: |
          # Internal-only networks do not publish ports on the Docker host.
          # Probe from a peer to also verify the origin's Docker DNS and routing.
          for attempt in {1..60}; do
            if docker exec browser-egress node -e "fetch('http://browser-worker:3000/health', { signal: AbortSignal.timeout(2000) }).then(r => { if (!r.ok) process.exit(1) }).catch(e => { console.error(e.message); process.exit(1) })"; then
              echo
              echo "Worker is healthy."
              exit 0
            fi
            if [[ "$(docker inspect --format '{{.State.Running}}' browser-worker 2>/dev/null || true)" != "true" ]]; then
              echo "Worker container stopped before becoming healthy."
              exit 1
            fi
            echo "Waiting for Worker health check (${attempt}/60)..."
            sleep 2
          done
          echo "Worker did not become healthy within 120 seconds."
          exit 1

      - name: Verify sandbox and browser network isolation
        if: inputs.mode == 'smoke_test'
        run: docker exec --env WORKER_INITIAL_URL=https://example.com browser-worker node test/container-security-probe.mjs

      - name: Start Cloudflare Quick Tunnel
        shell: bash
        run: |
          # Only the tunnel joins the outbound network; the Worker stays isolated.
          docker network create behavior-tunnel
          docker create --name cloudflared --network behavior-tunnel \
            --read-only --cap-drop ALL --security-opt no-new-privileges \
            --tmpfs /tmp:rw,nosuid,nodev,size=64m \
            cloudflare/cloudflared:2026.9.3 \
            tunnel --no-autoupdate --url http://browser-worker:3000 --loglevel info
          docker network connect behavior-browser cloudflared
          docker start cloudflared

      - name: Check Quick Tunnel health
        id: quick-tunnel
        shell: bash
        run: |
          tunnel_url=""
          for attempt in {1..60}; do
            tunnel_url="$(docker logs cloudflared 2>&1 | grep -Eo 'https://[-a-z0-9]+\.trycloudflare\.com' | tail -n 1 || true)"
            if [[ -n "$tunnel_url" ]] && curl --fail --silent --show-error "$tunnel_url/health"; then
              echo
              echo "Quick Tunnel is healthy."
              echo "url=$tunnel_url" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [[ "$(docker inspect --format '{{.State.Running}}' cloudflared 2>/dev/null || true)" != "true" ]]; then
              echo "cloudflared stopped before the Quick Tunnel became healthy."
              exit 1
            fi
            echo "Waiting for Quick Tunnel health check (${attempt}/60)..."
            sleep 2
          done
          echo "Quick Tunnel did not become healthy within 120 seconds."
          exit 1

      - name: Create session connection metadata
        shell: bash
        env:
          WORKER_SESSION_ID: ${{ inputs.session_id }}
          TUNNEL_URL: ${{ steps.quick-tunnel.outputs.url }}
        run: |
          jq --null-input \
            --arg sessionId "$WORKER_SESSION_ID" \
            --arg tunnelUrl "$TUNNEL_URL" \
            '{sessionId: $sessionId, tunnelUrl: $tunnelUrl}' \
            > "$RUNNER_TEMP/worker-session.json"

      - name: Upload session connection metadata
        uses: actions/upload-artifact@v7
        with:
          name: worker-session-${{ github.run_id }}
          path: ${{ runner.temp }}/worker-session.json
          archive: false
          if-no-files-found: error
          retention-days: 1

      - name: Keep session running
        if: inputs.mode == 'session'
        shell: bash
        run: |
          echo "Worker session and Quick Tunnel are running. Cancel this workflow to stop them."
          while [[ "$(docker inspect --format '{{.State.Running}}' browser-worker 2>/dev/null || true)" == "true" ]] \
            && [[ "$(docker inspect --format '{{.State.Running}}' cloudflared 2>/dev/null || true)" == "true" ]]; do
            sleep 30
          done
          worker_exit_code="$(docker inspect --format '{{.State.ExitCode}}' browser-worker 2>/dev/null || echo unknown)"
          tunnel_exit_code="$(docker inspect --format '{{.State.ExitCode}}' cloudflared 2>/dev/null || echo unknown)"
          if [[ "$worker_exit_code" == "0" && "$tunnel_exit_code" == "0" ]]; then
            echo "Worker session ended normally."
            exit 0
          fi
          if [[ "$worker_exit_code" == "0" && "$(docker inspect --format '{{.State.Running}}' cloudflared 2>/dev/null || true)" == "true" ]]; then
            echo "Worker session ended normally."
            exit 0
          fi
          echo "A session container stopped unexpectedly (Worker: $worker_exit_code, cloudflared: $tunnel_exit_code)."
          exit 1

      - name: Show container logs on failure
        if: failure()
        shell: bash
        run: |
          echo "=== browser-worker logs ==="
          docker logs browser-worker 2>&1 || true
          echo "=== cloudflared logs ==="
          docker logs cloudflared 2>&1 || true
          docker logs browser-egress 2>&1 || true
          docker inspect --format '{{json .State}} {{json .NetworkSettings.Networks}}' browser-worker 2>&1 || true

      - name: Remove session containers
        if: always()
        shell: bash
        run: |
          docker rm --force cloudflared 2>/dev/null || true
          docker rm --force browser-worker 2>/dev/null || true
          docker rm --force browser-egress 2>/dev/null || true
          docker network rm behavior-browser 2>/dev/null || true
          docker network rm behavior-tunnel 2>/dev/null || true
